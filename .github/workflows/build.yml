name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7"

jobs:
  engine-template:
    # Builds Godot's Android debug export template from source with the
    # patches in engine/patches/ (cached by patch content). Used for the
    # "Ultra Patched" APKs.
    name: Patched Godot Android template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache patched template
        id: cache-template
        uses: actions/cache@v4
        with:
          path: engine-build
          key: godot-android-template-${{ env.GODOT_VERSION }}-${{ hashFiles('engine/patches/**') }}

      - uses: actions/setup-java@v4
        if: steps.cache-template.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: "17"

      - name: Build template from source
        if: steps.cache-template.outputs.cache-hit != 'true'
        run: |
          pip install scons
          git clone -q --depth 1 --branch "${GODOT_VERSION}-stable" https://github.com/godotengine/godot.git godot-src
          cd godot-src
          for p in ../engine/patches/*.patch; do echo "Applying $p"; git apply "$p"; done
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          python misc/scripts/install_swappy_android.py
          scons platform=android target=template_debug arch=arm64 production=yes -j"$(nproc)"
          cd platform/android/java
          ./gradlew generateGodotTemplates
          cd ../../..
          ls -la bin
          mkdir -p ../engine-build
          cp bin/android_debug.apk ../engine-build/android_debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: godot-android-template-patched
          path: engine-build/android_debug.apk

  build:
    name: Android APK + desktop builds
    needs: engine-template
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && rm godot.zip
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf templates templates.tpz

      - name: Configure Android SDK and signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ~/.config/godot
          keytool -genkeypair -v -keystore ~/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > ~/.config/godot/editor_settings-$(echo "$GODOT_VERSION" | cut -d. -f1-2).tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/release.keystore
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/release.keystore" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEYSTORE_ALIAS" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNING=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/download-artifact@v4
        with:
          name: godot-android-template-patched
          path: build/patched

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Export
        run: |
          mkdir -p build/linux build/windows
          mode=--export-debug
          if [ "$RELEASE_SIGNING" = "1" ]; then mode=--export-release; fi
          ~/godot/godot --headless --path . $mode "Android" build/Backrooms-OSS.apk
          ~/godot/godot --headless --path . $mode "Android Ultra" build/Backrooms-OSS-Ultra.apk
          # Diagnostic build is always debuggable so its files can be pulled with run-as.
          ~/godot/godot --headless --path . --export-debug "Android Ultra Debug" build/Backrooms-OSS-Ultra-Debug.apk
          # Ultra on the patched engine (see engine/patches/).
          sed -i "s#@PATCHED_TEMPLATE@#$GITHUB_WORKSPACE/build/patched/android_debug.apk#" export_presets.cfg
          ~/godot/godot --headless --path . --export-debug "Android Ultra Patched" build/Backrooms-OSS-Ultra-Patched.apk
          ~/godot/godot --headless --path . --export-debug "Android Ultra Patched Debug" build/Backrooms-OSS-Ultra-Patched-Debug.apk
          test -s build/Backrooms-OSS-Ultra-Patched.apk
          ~/godot/godot --headless --path . --export-release "Linux" build/linux/Backrooms-OSS.x86_64
          ~/godot/godot --headless --path . --export-release "Windows" build/windows/Backrooms-OSS.exe
          test -s build/Backrooms-OSS.apk
          test -s build/Backrooms-OSS-Ultra.apk
          cd build && zip -qr Backrooms-OSS-linux.zip linux && zip -qr Backrooms-OSS-windows.zip windows

      - uses: actions/upload-artifact@v4
        with:
          name: Backrooms-OSS-android
          path: |
            build/Backrooms-OSS.apk
            build/Backrooms-OSS-Ultra.apk
            build/Backrooms-OSS-Ultra-Debug.apk
            build/Backrooms-OSS-Ultra-Patched.apk
            build/Backrooms-OSS-Ultra-Patched-Debug.apk

      - name: Fetch Vulkan validation layer (for debugging GPU driver issues)
        run: |
          v=1.4.304.0
          curl -sSL -o vvl.zip "https://github.com/KhronosGroup/Vulkan-ValidationLayers/releases/download/vulkan-sdk-$v/android-binaries-$v.zip"
          unzip -q -j vvl.zip "android-binaries-$v/arm64-v8a/libVkLayer_khronos_validation.so" -d build/vvl

      - uses: actions/upload-artifact@v4
        with:
          name: vulkan-validation-layer-arm64
          path: build/vvl/libVkLayer_khronos_validation.so

      - uses: actions/upload-artifact@v4
        with:
          name: Backrooms-OSS-desktop
          path: |
            build/Backrooms-OSS-linux.zip
            build/Backrooms-OSS-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Backrooms-OSS.apk
            build/Backrooms-OSS-Ultra.apk
            build/Backrooms-OSS-linux.zip
            build/Backrooms-OSS-windows.zip
