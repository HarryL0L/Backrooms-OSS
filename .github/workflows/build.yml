name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.5.1

jobs:
  build:
    name: Android APK + desktop builds
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && rm godot.zip
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf templates templates.tpz

      - name: Configure Android SDK and signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ~/.config/godot
          keytool -genkeypair -v -keystore ~/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/release.keystore
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/release.keystore" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEYSTORE_ALIAS" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNING=1" >> "$GITHUB_ENV"
          fi

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Export
        run: |
          mkdir -p build/linux build/windows
          mode=--export-debug
          if [ "$RELEASE_SIGNING" = "1" ]; then mode=--export-release; fi
          ~/godot/godot --headless --path . $mode "Android" build/Backrooms-OSS.apk
          ~/godot/godot --headless --path . $mode "Android Ultra" build/Backrooms-OSS-Ultra.apk
          ~/godot/godot --headless --path . --export-release "Linux" build/linux/Backrooms-OSS.x86_64
          ~/godot/godot --headless --path . --export-release "Windows" build/windows/Backrooms-OSS.exe
          test -s build/Backrooms-OSS.apk
          test -s build/Backrooms-OSS-Ultra.apk
          cd build && zip -qr Backrooms-OSS-linux.zip linux && zip -qr Backrooms-OSS-windows.zip windows

      - uses: actions/upload-artifact@v4
        with:
          name: Backrooms-OSS-android
          path: |
            build/Backrooms-OSS.apk
            build/Backrooms-OSS-Ultra.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Backrooms-OSS-desktop
          path: |
            build/Backrooms-OSS-linux.zip
            build/Backrooms-OSS-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Backrooms-OSS.apk
            build/Backrooms-OSS-Ultra.apk
            build/Backrooms-OSS-linux.zip
            build/Backrooms-OSS-windows.zip
